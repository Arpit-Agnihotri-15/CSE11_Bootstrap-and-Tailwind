<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <!-- Heading -->
    <h1 class="mb-3">Bootstrap Heading 1</h1>

    <!-- Lead Paragraph -->
    <p class="lead mb-4">This is the lead paragraph.</p>

    <!-- Image -->
    <img src="images/img1.jpg" alt="Image 1" class="img-fluid mb-4">

    <!-- Buttons -->
    <div class="mb-4">
        <button type="button" class="btn btn-primary me-2" onclick="handleClick()">Click Me</button>
        <button type="button" class="btn btn-outline-secondary btn-sm me-2">Small Outline Button</button>
        <button type="button" class="btn btn-primary">
            Notifications
            <span class="badge bg-danger">4</span>
        </button>
    </div>

    <hr class="my-4">

    <!-- Carousel -->
    <div id="carouselExampleSlidesOnly" class="carousel slide mb-4" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="images/slide1.jpg" class="d-block w-100" alt="Slide 1">
            </div>
            <div class="carousel-item">
                <img src="images/slide2.jpeg" class="d-block w-100" alt="Slide 2">
            </div>
        </div>
    </div>

    <!-- Progress Bar -->
    <div class="progress">
        <div id="progressBar" class="progress-bar" role="progressbar" 
             style="width: 75%" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">
            75%
        </div>
    </div>

</div>

<!-- Custom JS -->
<script>
    function handleClick() {
        alert("Button Clicked!");
    }

    // increase progress bar dynamically
    let progress = 75;
    function increaseProgress() {
        if (progress < 100) {
            progress += 5;
            let bar = document.getElementById("progressBar");
            bar.style.width = progress + "%";
            bar.innerText = progress + "%";
        }
    }

    // Auto increase progress every 2 seconds
    setInterval(increaseProgress, 2000);
</script>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


</body>
</html>
