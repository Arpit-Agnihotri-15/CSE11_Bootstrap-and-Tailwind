<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <!-- Heading -->
    <h1 class="mb-3">Bootstrap Heading 1</h1>

    <!-- Lead Paragraph -->
    <p class="lead mb-4">
        This is the lead paragraph.
    </p>

    <!-- Image -->
    <img src="images/img1.jpg"
         alt="Sample Image"
         class="img-fluid rounded mb-4">

    <!-- Buttons -->
    <div class="mb-4">

        <button type="button"
                class="btn btn-primary me-2"
                onclick="handleClick()">
            Click Me
        </button>

        <button type="button"
                class="btn btn-outline-secondary btn-sm me-2">
            Small Outline Button
        </button>

        <button type="button" class="btn btn-primary me-2">
            Notifications
            <span class="badge bg-danger ms-1">4</span>
        </button>

        <button type="button" class="btn btn-primary me-2">
            <span class="badge bg-primary">Primary</span>
        </button>

        <button type="button" class="btn btn-secondary me-2">
            <span class="badge bg-secondary">Secondary</span>
        </button>

        <button type="button" class="btn btn-success me-2">
            <span class="badge bg-success">Success</span>
        </button>

        <button type="button" class="btn btn-danger me-2">
            <span class="badge bg-danger">Danger</span>
        </button>

        <button type="button" class="btn btn-warning text-dark me-2">
            <span class="badge bg-warning text-dark">Warning</span>
        </button>

        <button type="button" class="btn btn-info text-dark me-2">
            <span class="badge bg-info text-dark">Info</span>
        </button>

        <button type="button" class="btn btn-light text-dark me-2">
            <span class="badge bg-light text-dark">Light</span>
        </button>

        <button type="button" class="btn btn-dark">
            <span class="badge bg-dark">Dark</span>
        </button>

    </div>

    <hr class="my-4">

    <!-- Carousel -->
    <div id="carouselExampleSlidesOnly"
         class="carousel slide mb-4 overflow-hidden rounded"
         data-bs-ride="carousel">

        <div class="carousel-inner">

            <div class="carousel-item active">
                <img src="images/slide1.jpg"
                     class="d-block w-100"
                     alt="Slide 1">
            </div>

            <div class="carousel-item">
                <img src="images/slide2.jpeg"
                     class="d-block w-100"
                     alt="Slide 2">
            </div>

        </div>
    </div>

    <!-- Progress Bar -->
    <div class="progress mb-4">

        <div id="progressBar"
             class="progress-bar progress-bar-striped progress-bar-animated"
             role="progressbar"
             style="width: 75%;"
             aria-valuenow="75"
             aria-valuemin="0"
             aria-valuemax="100">

            75%

        </div>

    </div>

    <!-- Grid Layout -->
    <div class="container mb-4">

        <div class="row g-3">

            <div class="col-12 col-md-6 col-lg-3">
                <div class="bg-primary text-white p-3 text-center rounded">
                    Column 1
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="bg-success text-white p-3 text-center rounded">
                    Column 2
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="bg-warning text-dark p-3 text-center rounded">
                    Column 3
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="bg-danger text-white p-3 text-center rounded">
                    Column 4
                </div>
            </div>

        </div>
    </div>

    <!-- Form -->
    <form class="mb-4">

        <div class="mb-3">

            <label for="exampleInputEmail1" class="form-label">
                Email address
            </label>

            <input type="email"
                   class="form-control"
                   id="exampleInputEmail1"
                   aria-describedby="emailHelp"
                   required>

            <div id="emailHelp" class="form-text">
                We'll never share your email with anyone else.
            </div>

        </div>

        <button type="submit" class="btn btn-primary">
            Submit
        </button>

    </form>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light rounded">

        <div class="container-fluid">

            <a class="navbar-brand" href="#">
                My App
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav">

                    <li class="nav-item">
                        <a class="nav-link active"
                           aria-current="page"
                           href="#">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Features
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <br> 
    
    <!--Card-->
    <!-- Card -->
<div class="card shadow rounded mb-4" style="width: 18rem;">

    <img src="images/card.webp"
         class="card-img-top"
         alt="Bootstrap Card Image"
         loading="lazy">

    <div class="card-body">

        <h5 class="card-title">
            Card Title
        </h5>

        <p class="card-text">
            This is a simple card example using Bootstrap.
        </p>

        <a href="#"
           class="btn btn-primary">
            Go Somewhere
        </a>

    </div>

</div>
    </div>

</div>

<!-- Custom JS -->
<script>

    function handleClick() {
        alert("Button Clicked!");
    }

    // Progress bar logic
    let progress = 75;

    function increaseProgress() {

        if (progress < 100) {

            progress += 5;

            let bar = document.getElementById("progressBar");

            bar.style.width = progress + "%";
            bar.innerText = progress + "%";
            bar.setAttribute("aria-valuenow", progress);

        }
    }

    // Auto increase every 2 seconds
    setInterval(increaseProgress, 2000);

</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
